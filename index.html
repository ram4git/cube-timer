<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuber Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .touch-indicator {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            opacity: 0.7;
        }
        
        .touch-indicator-outer {
            border: 2px solid rgba(139, 92, 246, 0.5);
            background: rgba(139, 92, 246, 0.1);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }
        
        .touch-indicator-inner {
            background: rgba(139, 92, 246, 0.4);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: white;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Animated gradient background orbs */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            animation: float1 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            right: -20%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, transparent 70%);
            animation: float2 25s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(10%, 15%) scale(1.1); }
            66% { transform: translate(-5%, 8%) scale(0.95); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-10%, -10%) scale(1.05); }
            66% { transform: translate(8%, -5%) scale(0.9); }
        }

        /* Glassmorphism card */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .glass-card-sm {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            box-shadow:
                0 4px 16px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .timer-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 22vw;
            letter-spacing: -0.04em;
            font-weight: 800;
            background: linear-gradient(135deg, #e0e7ff 0%, #a5b4fc 30%, #818cf8 60%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 40px rgba(129, 140, 248, 0.25));
            transition: filter 0.3s ease, transform 0.2s ease;
            line-height: 1;
        }

        .timer-display.running {
            background: linear-gradient(135deg, #86efac 0%, #4ade80 30%, #22c55e 60%, #a3e635 100%);
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 0 50px rgba(74, 222, 128, 0.3));
        }

        .timer-display.stopped {
            background: linear-gradient(135deg, #fde68a 0%, #fbbf24 30%, #f59e0b 60%, #fb923c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 0 50px rgba(251, 191, 36, 0.3));
            animation: pulse-glow 2s ease-in-out;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); }
            15% { transform: scale(1.02); }
            30% { transform: scale(1); }
        }
        
        @media (max-width: 640px) {
            .timer-display {
                font-size: 28vw;
            }
        }

        /* Title gradient */
        .title-gradient {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Status pill */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .status-waiting {
            background: rgba(250, 204, 21, 0.1);
            border: 1px solid rgba(250, 204, 21, 0.2);
            color: #fde047;
        }

        .status-running {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }

        .status-solving {
            background: rgba(96, 165, 250, 0.1);
            border: 1px solid rgba(96, 165, 250, 0.2);
            color: #60a5fa;
        }

        .status-stopped {
            background: rgba(251, 113, 133, 0.1);
            border: 1px solid rgba(251, 113, 133, 0.2);
            color: #fb7185;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Sidebar */
        .sidebar {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-left: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: -8px 0 32px rgba(0, 0, 0, 0.2);
        }

        .sidebar-title {
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 600;
        }

        .time-entry {
            padding: 8px 12px;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease;
            text-align: right;
        }

        .time-entry:hover {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.8);
        }

        .time-entry.record {
            color: #fbbf24;
            font-weight: 700;
            background: rgba(251, 191, 36, 0.08);
            border: 1px solid rgba(251, 191, 36, 0.15);
        }

        .time-entry.record::before {
            content: '\2B50';
            margin-right: 6px;
            font-size: 0.7rem;
        }

        /* Last time badge */
        .last-time-badge {
            font-family: 'JetBrains Mono', monospace;
            color: rgba(255, 255, 255, 0.45);
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        /* Scrollbar */
        #previous-times::-webkit-scrollbar {
            width: 3px;
        }
        
        #previous-times::-webkit-scrollbar-track {
            background: transparent;
        }
        
        #previous-times::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }

        #previous-times::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Key display */
        .key-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Footer link */
        .footer-link {
            color: rgba(255, 255, 255, 0.25);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .footer-link:hover {
            color: rgba(139, 92, 246, 0.8);
        }

        /* Content wrapper */
        .content-wrapper {
            position: relative;
            z-index: 1;
        }

        /* Subtle noise texture overlay */
        .noise-overlay {
            position: fixed;
            inset: 0;
            opacity: 0.015;
            pointer-events: none;
            z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 relative">
    <div class="noise-overlay"></div>
    <div id="touch-indicators"></div>
    
    <div class="content-wrapper text-center w-full max-w-4xl mx-auto">
        <!-- Header -->
        <div class="mb-4">
            <h1 class="text-4xl md:text-5xl font-black mb-3 title-gradient tracking-tight">CUBER TIMER</h1>
            <p class="text-sm text-white/30 font-light">Press any two non-adjacent keys or touch points to start/stop</p>
        </div>
        
        <!-- Timer -->
        <div class="my-4">
            <div class="timer-display" id="timer">0.00</div>
        </div>
        
        <!-- Last time -->
        <div class="last-time-badge mb-6" id="last-time"></div>
        
        <!-- Status -->
        <div class="mb-6">
            <span id="status" class="status-pill status-waiting">
                <span class="status-dot"></span>
                Waiting to start
            </span>
        </div>
        
        <!-- Keys display -->
        <div class="glass-card-sm inline-block px-5 py-3">
            <span class="text-xs text-white/25 uppercase tracking-widest font-medium">Keys </span>
            <span id="pressed-keys" class="key-badge ml-2">None</span>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="fixed right-0 top-0 h-full w-44 sidebar p-5 overflow-y-auto" id="previous-times">
        <div class="sidebar-title mb-4 pt-2">Times</div>
    </div>

    <script>
        // QWERTY keyboard layout adjacency map
        const adjacencyMap = {
            '`': ['1', 'Tab'],
            '1': ['`', '2', 'q'],
            '2': ['1', '3', 'q', 'w'],
            '3': ['2', '4', 'w', 'e'],
            '4': ['3', '5', 'e', 'r'],
            '5': ['4', '6', 'r', 't'],
            '6': ['5', '7', 't', 'y'],
            '7': ['6', '8', 'y', 'u'],
            '8': ['7', '9', 'u', 'i'],
            '9': ['8', '0', 'i', 'o'],
            '0': ['9', '-', 'o', 'p'],
            '-': ['0', '=', 'p', '['],
            '=': ['-', 'Backspace', '[', ']'],
            
            'q': ['1', '2', 'w', 'a', 'Tab', 'CapsLock'],
            'w': ['2', '3', 'q', 'e', 'a', 's'],
            'e': ['3', '4', 'w', 'r', 's', 'd'],
            'r': ['4', '5', 'e', 't', 'd', 'f'],
            't': ['5', '6', 'r', 'y', 'f', 'g'],
            'y': ['6', '7', 't', 'u', 'g', 'h'],
            'u': ['7', '8', 'y', 'i', 'h', 'j'],
            'i': ['8', '9', 'u', 'o', 'j', 'k'],
            'o': ['9', '0', 'i', 'p', 'k', 'l'],
            'p': ['0', '-', 'o', '[', 'l', ';'],
            
            'a': ['q', 'w', 's', 'z', 'CapsLock', 'Shift'],
            's': ['w', 'e', 'a', 'd', 'z', 'x'],
            'd': ['e', 'r', 's', 'f', 'x', 'c'],
            'f': ['r', 't', 'd', 'g', 'c', 'v'],
            'g': ['t', 'y', 'f', 'h', 'v', 'b'],
            'h': ['y', 'u', 'g', 'j', 'b', 'n'],
            'j': ['u', 'i', 'h', 'k', 'n', 'm'],
            'k': ['i', 'o', 'j', 'l', 'm', ','],
            'l': ['o', 'p', 'k', ';', ',', '.'],
            
            'z': ['a', 's', 'x', 'Shift'],
            'x': ['s', 'd', 'z', 'c'],
            'c': ['d', 'f', 'x', 'v'],
            'v': ['f', 'g', 'c', 'b'],
            'b': ['g', 'h', 'v', 'n'],
            'n': ['h', 'j', 'b', 'm'],
            'm': ['j', 'k', 'n', ','],
            ',': ['k', 'l', 'm', '.'],
            '.': ['l', ';', ',', '/'],
            '/': [';', '.', 'Shift']
        };

        // State variables
        let timer = null;
        let startTime = 0;
        let currentTime = 0;
        let running = false;
        let pressedKeys = new Set();
        let touchPoints = new Map();
        let lastTime = 0;
        let previousTimes = [];
        let recordTime = Infinity;
        
        // DOM elements
        const timerDisplay = document.getElementById('timer');
        const pressedKeysDisplay = document.getElementById('pressed-keys');
        const statusDisplay = document.getElementById('status');
        // Format time to 2 decimal places
        function formatTime(ms) {
            return (ms / 1000).toFixed(2);
        }
        
        // Update the timer display
        function updateTimer() {
            currentTime = Date.now() - startTime;
            timerDisplay.textContent = formatTime(currentTime);
        }
        
        // Calculate distance between two points
        function getDistance(x1, y1, x2, y2) {
            return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
        }
        
        // Check if two touch points are far enough apart
        function areTouchesFarEnough(touches) {
            if (touches.length < 2) return false;
            
            // Get all pairs of touches and check if any are at least 100px apart
            for (let i = 0; i < touches.length; i++) {
                for (let j = i + 1; j < touches.length; j++) {
                    const t1 = touches[i];
                    const t2 = touches[j];
                    if (getDistance(t1.clientX, t1.clientY, t2.clientX, t2.clientY) > 100) {
                        return true;
                    }
                }
            }
            return false;
        }
        
        // Update touch indicators
        function updateTouchIndicators() {
            const container = document.getElementById('touch-indicators');
            container.innerHTML = '';
            
            touchPoints.forEach((pos, identifier) => {
                // Outer circle
                const outer = document.createElement('div');
                outer.className = 'touch-indicator touch-indicator-outer';
                outer.style.width = '60px';
                outer.style.height = '60px';
                outer.style.left = `${pos.x}px`;
                outer.style.top = `${pos.y}px`;
                
                // Inner circle
                const inner = document.createElement('div');
                inner.className = 'touch-indicator touch-indicator-inner';
                inner.style.width = '30px';
                inner.style.height = '30px';
                inner.style.left = `${pos.x}px`;
                inner.style.top = `${pos.y}px`;
                
                container.appendChild(outer);
                container.appendChild(inner);
            });
        }
        
        // Check if two keys are non-adjacent
        function areKeysNonAdjacent(key1, key2) {
            // Convert to lowercase for case-insensitive comparison
            key1 = key1.toLowerCase();
            key2 = key2.toLowerCase();
            
            // If either key isn't in our adjacency map, assume they're not adjacent
            if (!adjacencyMap[key1] || !adjacencyMap[key2]) {
                return true;
            }
            
            // Check if key2 is adjacent to key1
            return !adjacencyMap[key1].includes(key2);
        }
        
        // Check if current pressed keys meet the start/stop condition
        function checkStartStopCondition() {
            const keys = Array.from(pressedKeys);
            
            // Need at least two keys pressed
            if (keys.length < 2) return false;
            
            // Check all pairs of pressed keys to find at least one non-adjacent pair
            for (let i = 0; i < keys.length; i++) {
                for (let j = i + 1; j < keys.length; j++) {
                    if (areKeysNonAdjacent(keys[i], keys[j])) {
                        return true;
                    }
                }
            }
            
            return false;
        }
        
        // Start the timer
        function startTimer() {
            if (running) return;
            
            startTime = Date.now();
            timer = setInterval(updateTimer, 10);
            running = true;
            timerDisplay.classList.remove('stopped');
            timerDisplay.classList.add('running');
            statusDisplay.innerHTML = '<span class="status-dot"></span>Running';
            statusDisplay.className = 'status-pill status-running';
        }
        
        // Stop the timer
        function stopTimer() {
            if (!running) return;
            
            clearInterval(timer);
            running = false;
            lastTime = currentTime;
            timerDisplay.classList.remove('running');
            timerDisplay.classList.add('stopped');
            statusDisplay.innerHTML = '<span class="status-dot"></span>Stopped';
            statusDisplay.className = 'status-pill status-stopped';
            
            // Add to previous times
            previousTimes.push(lastTime);
            
            // Update record if this is the fastest time
            if (lastTime < recordTime) {
                recordTime = lastTime;
            }
            
            // Update displays
            updateLastTimeDisplay();
            updatePreviousTimesDisplay();
        }
        
        // Update last time display
        function updateLastTimeDisplay() {
            document.getElementById('last-time').textContent = `Last: ${formatTime(lastTime)}`;
        }
        
        // Update previous times display
        function updatePreviousTimesDisplay() {
            const container = document.getElementById('previous-times');
            container.innerHTML = '<div class="sidebar-title mb-4 pt-2">Times</div>';
            
            // Sort times (fastest first)
            const sortedTimes = [...previousTimes].sort((a, b) => a - b);
            
            sortedTimes.forEach(time => {
                const timeElement = document.createElement('div');
                timeElement.textContent = formatTime(time);
                timeElement.className = 'time-entry';
                
                // Highlight record time
                if (time === recordTime) {
                    timeElement.className += ' record';
                }
                
                container.appendChild(timeElement);
            });
        }
        
        // Handle key down events
        function handleKeyDown(e) {
            // Ignore modifier keys
            if (['Control', 'Shift', 'Alt', 'Meta', 'CapsLock', 'Tab', 'Backspace'].includes(e.key)) {
                return;
            }
            
            // Add key to pressed keys set
            pressedKeys.add(e.key);
            
            // Update pressed keys display
            pressedKeysDisplay.textContent = Array.from(pressedKeys).join(', ');
            
            // Check if we should start/stop the timer
            if (checkStartStopCondition()) {
                if (running) {
                    stopTimer();
                } else {
                    startTimer();
                }
            }
        }
        
        // Handle key up events
        function handleKeyUp(e) {
            // Remove key from pressed keys set
            pressedKeys.delete(e.key);
            
            // Update pressed keys display
            pressedKeysDisplay.textContent = pressedKeys.size > 0 ? Array.from(pressedKeys).join(', ') : 'None';
            
            // If no keys are pressed and timer was just started, change status
            if (pressedKeys.size === 0 && running) {
                statusDisplay.innerHTML = '<span class="status-dot"></span>Solving...';
                statusDisplay.className = 'status-pill status-solving';
            }
        }
        
        // Touch event handlers
        function handleTouchStart(e) {
            e.preventDefault();
            
            // Add all new touches
            Array.from(e.changedTouches).forEach(touch => {
                touchPoints.set(touch.identifier, {
                    x: touch.clientX,
                    y: touch.clientY
                });
            });
            
            updateTouchIndicators();
            
            // Check if we should start/stop the timer
            if (areTouchesFarEnough(Array.from(e.touches))) {
                if (running) {
                    stopTimer();
                } else {
                    startTimer();
                }
            }
        }
        
        function handleTouchMove(e) {
            e.preventDefault();
            
            // Update touch positions
            Array.from(e.changedTouches).forEach(touch => {
                if (touchPoints.has(touch.identifier)) {
                    touchPoints.set(touch.identifier, {
                        x: touch.clientX,
                        y: touch.clientY
                    });
                }
            });
            
            updateTouchIndicators();
        }
        
        function handleTouchEnd(e) {
            e.preventDefault();
            
            // Remove ended touches
            Array.from(e.changedTouches).forEach(touch => {
                touchPoints.delete(touch.identifier);
            });
            
            updateTouchIndicators();
        }
        
        // Initialize
        document.addEventListener('keydown', handleKeyDown);
        document.addEventListener('keyup', handleKeyUp);
        document.addEventListener('touchstart', handleTouchStart, { passive: false });
        document.addEventListener('touchmove', handleTouchMove, { passive: false });
        document.addEventListener('touchend', handleTouchEnd, { passive: false });
        
        // Reset timer when clicking on it
        timerDisplay.addEventListener('click', () => {
            if (!running) {
                timerDisplay.textContent = '0.00';
                timerDisplay.classList.remove('running', 'stopped');
                lastTime = 0;
                document.getElementById('last-time').textContent = '';
                statusDisplay.innerHTML = '<span class="status-dot"></span>Waiting to start';
                statusDisplay.className = 'status-pill status-waiting';
                previousTimes = [];
                recordTime = Infinity;
                document.getElementById('previous-times').innerHTML = '<div class="sidebar-title mb-4 pt-2">Times</div>';
            }
        });
        
    </script>

    <!-- Footer -->
    <div class="fixed bottom-5 left-0 right-0 text-center z-10">
        <a href="https://twitter.com/irraju" target="_blank" class="footer-link">@irraju</a>
    </div>
</body>
</html>
